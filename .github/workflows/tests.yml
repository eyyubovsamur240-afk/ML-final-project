name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Unit tests (models and metrics vs scikit-learn, parsing, splits)
        run: python -m pytest -q
      - name: End-to-end smoke run on SYNTHETIC bina.az-shaped data
        run: |
          python -m tests.fake_binaaz /tmp/fake_binaaz.csv 5000
          python -m src.run_all --fast --data /tmp/fake_binaaz.csv --out-dir /tmp/run_all_out
