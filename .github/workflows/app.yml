name: app

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install app dependencies
        run: pip install -r requirements-app.txt
      - name: Interface tests (serving model + HTTP API on synthetic data)
        run: python -m pytest -q tests/test_app.py
      - name: Train a fast bundle on synthetic data
        run: |
          python -m tests.fake_binaaz /tmp/fake.csv 3000
          python -m app.train --fast --data /tmp/fake.csv --out models/predictor.pkl

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Train a fast bundle on synthetic data
        run: |
          pip install -r requirements.txt
          python -m tests.fake_binaaz /tmp/fake.csv 3000
          python -m app.train --fast --data /tmp/fake.csv --out models/predictor.pkl
          chmod -R a+rX models
      - name: Build image
        run: docker build -t binaaz-estimator .
      - name: Run container and request a prediction
        run: |
          docker run -d --name web -p 8000:8000 -v "$PWD/models:/app/models:ro" binaaz-estimator
          for i in $(seq 30); do curl -fs localhost:8000/api/health && break; sleep 1; done
          curl -fs localhost:8000/api/health | grep -q '"model_loaded":true'
          curl -fs -X POST localhost:8000/api/predict -H 'Content-Type: application/json' \
            -d '{"category":"yeni tikili","area_m2":90,"rooms":3,"floor":5,"total_floors":12}' | tee /dev/stderr | grep -q price_azn
      - name: Container logs
        if: always()
        run: docker logs web || true
